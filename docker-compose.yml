services:
  monitor:
    build: .
    container_name: resource-monitor
    ports:
      - "1010:1010"
    # No environment variables. Optional bearer auth: add
    # `environment: [MONITOR_TOKEN=change-me]` to require a token on every
    # request (open the dashboard as http://host:1010/?token=<same value>).
    volumes:
      # The Docker Engine socket, mounted read-only. The app's in-process
      # gateway (app/docker_gateway.py) only issues hard-coded GET endpoints
      # (containers, images, version, ping), so the monitor can list
      # containers and read stats but cannot create, start, stop, kill, exec,
      # build, or otherwise mutate anything on the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Join the host's docker group so the non-root app process may reach the
    # (group-owned) socket. 985 is this host's docker GID — set it to
    # `getent group docker`'s GID if you deploy elsewhere.
    group_add:
      - "985"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
