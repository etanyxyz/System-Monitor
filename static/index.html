<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- keep the ?token= auth param out of Referer headers -->
  <meta name="referrer" content="no-referrer">
  <!-- inline favicon: no request, no 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d1117'/%3E%3Cpath d='M2 10h3l2-6 3 8 2-5h2' stroke='%233fb950' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>Resource Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="title">
      <h1>Resource Monitor</h1>
      <span id="conn-status" class="dot" title="live"></span>
    </div>
    <div class="meta">
      <span id="uptime">—</span>
      <span id="load">—</span>
      <span id="cores-count">—</span>
    </div>
  </header>

  <main>
    <section class="cards">
      <div class="card">
        <div class="card-head">
          <span class="label">CPU</span>
          <span id="cpu-overall" class="big">–</span>
        </div>
        <div class="spark"><canvas id="cpu-spark"></canvas></div>
      </div>

      <div class="card">
        <div class="card-head">
          <span class="label">Memory</span>
          <span id="ram-overall" class="big">–</span>
        </div>
        <div class="spark"><canvas id="ram-spark"></canvas></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Timeline</h2>
        <div class="ranges">
          <button class="range-btn active" data-range="300">5 min</button>
          <button class="range-btn" data-range="900">15 min</button>
          <button class="range-btn" data-range="3600">1 hour</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="sys-timeline"></canvas></div>
      <h3 class="panel-sub">Per-container CPU</h3>
      <div class="chart-wrap"><canvas id="cont-timeline"></canvas></div>
    </section>

    <section class="panel">
      <h2>CPU by core</h2>
      <div class="chart-wrap"><canvas id="core-chart"></canvas></div>
    </section>

    <section class="panel">
      <h2>Memory breakdown <span id="swap-sub" class="sub"></span></h2>
      <div class="chart-wrap short"><canvas id="mem-chart"></canvas></div>
    </section>

    <section class="panel">
      <h2>Containers <span id="container-count" class="sub"></span></h2>
      <div id="docker-error" class="error" hidden></div>
      <div class="table-scroll">
        <table id="containers-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Image</th>
              <th>Command</th>
              <th>Created</th>
              <th>Status</th>
              <th>Ports</th>
              <th>Name</th>
              <th>Labels</th>
              <th>CPU</th>
              <th>Memory</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
